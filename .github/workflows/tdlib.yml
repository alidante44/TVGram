name: Build TDLib

# TDLib is native code and Telegram's published Android archive is currently
# not serving a real build, so we build it ourselves from source using TDLib's
# own Dockerfile and publish the result as a release this repo can fetch.
#
# This is slow (an hour or more: OpenSSL and TDLib, each for four ABIs), so it
# runs only on demand — not on every push.

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: "tdlib/td commit or tag to build (default: master)"
        required: false
        default: "master"
      from_artifact_run_id:
        description: "Reuse the tdlib archive from this run id instead of rebuilding"
        required: false
        default: ""

permissions:
  contents: write
  # gh run download reads another run's artifacts; an explicit permissions block
  # replaces the defaults, so this has to be named.
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Free up disk space
        if: inputs.from_artifact_run_id == ''
        # The runner starts with roughly 14 GB free; the SDK, NDK, OpenSSL and
        # four ABIs of TDLib object files need considerably more than that.
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          docker image prune -af || true
          echo "After:"; df -h / | tail -1

      - name: Set up Buildx
        if: inputs.from_artifact_run_id == ''
        # A container-driver builder is what makes the GitHub Actions layer
        # cache below usable, so a re-run can skip the SDK and OpenSSL stages
        # instead of repeating ~15 minutes of work.
        uses: docker/setup-buildx-action@v3

      - name: Check out TDLib
        if: inputs.from_artifact_run_id == ''
        # Only for the Dockerfile and the scripts it COPYs; the Dockerfile
        # clones the sources it actually compiles by itself.
        run: git clone --depth 1 https://github.com/tdlib/td.git td

      - name: Build TDLib for Android
        if: inputs.from_artifact_run_id == ''
        env:
          COMMIT_HASH: ${{ inputs.commit_hash }}
          DOCKER_BUILDKIT: "1"
        run: |
          cd td/example/android
          docker buildx build \
            --build-arg COMMIT_HASH="${COMMIT_HASH:-master}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --output "type=local,dest=${GITHUB_WORKSPACE}/tdlib-out" \
            .

      - name: Upload as artifact
        if: inputs.from_artifact_run_id == ''
        # Before verification, deliberately: an hour of build time should not be
        # thrown away by a bug in the check below.
        uses: actions/upload-artifact@v4
        with:
          name: tdlib
          if-no-files-found: error
          path: tdlib-out/tdlib.zip

      - name: Reuse an existing archive
        if: inputs.from_artifact_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.from_artifact_run_id }}
        run: |
          set -euo pipefail
          # No checkout happens on this path, so gh cannot infer the repository.
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name tdlib --dir "${GITHUB_WORKSPACE}/tdlib-out"
          ls -la "${GITHUB_WORKSPACE}/tdlib-out"

      - name: Verify the archive
        id: verify
        env:
          COMMIT_HASH: ${{ inputs.commit_hash }}
        # Publishing a half-built archive would be worse than failing here: the
        # app would compile and then fail at runtime on a missing ABI.
        #
        # Nothing below pipes the listing into another command. `grep -q` and
        # `head` both exit as soon as they have what they need, and the writer
        # then dies of SIGPIPE, which fails the step under pipefail — that false
        # "missing TdApi.java" cost two builds. Bash pattern matching needs no
        # second process at all.
        run: |
          set -euo pipefail
          zip="${GITHUB_WORKSPACE}/tdlib-out/tdlib.zip"
          [ -f "$zip" ] || { echo "::error::tdlib.zip was not produced"; exit 1; }

          size=$(wc -c <"$zip")
          echo "tdlib.zip is $size bytes"
          [ "$size" -gt 10000000 ] || { echo "::error::tdlib.zip is only $size bytes"; exit 1; }

          listing=$(unzip -l "$zip")

          echo "Native libraries in the archive:"
          grep 'libs/' <<<"$listing" || true

          # armeabi-v7a and arm64-v8a are what real TV boxes ship; x86 and
          # x86_64 only matter for emulators, so they are reported, not required.
          for abi in armeabi-v7a arm64-v8a; do
            [[ "$listing" == *"libs/$abi/libtdjni.so"* ]] \
              || { echo "::error::missing libtdjni.so for $abi"; exit 1; }
          done
          for abi in x86 x86_64; do
            [[ "$listing" == *"libs/$abi/libtdjni.so"* ]] \
              || echo "::warning::no libtdjni.so for $abi (emulator builds will not run)"
          done

          [[ "$listing" == *"org/drinkless/tdlib/TdApi.java"* ]] \
            || { echo "::error::missing TdApi.java"; exit 1; }

          echo "All required ABIs and the Java bindings are present."
          echo "tag=tdlib-$(date -u +%Y%m%d)-${COMMIT_HASH:-master}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATED_TAG: ${{ steps.verify.outputs.tag }}
        run: |
          set -euo pipefail
          notes="TDLib for Android, built from tdlib/td@${{ inputs.commit_hash }} by .github/workflows/tdlib.yml.

          Contains libtdjni.so for armeabi-v7a, arm64-v8a, x86 and x86_64 plus the
          org.drinkless.tdlib Java bindings. scripts/fetch-tdlib.sh installs it."

          # A dated tag keeps the history; tdlib-latest is the stable address
          # scripts/fetch-tdlib.sh downloads from.
          # Every gh call needs --repo: this job may never have checked out this
          # repository (the reuse path does not, and the build path only clones
          # tdlib/td), so there is no git remote for gh to infer it from.
          repo="$GITHUB_REPOSITORY"

          gh release create "$DATED_TAG" tdlib-out/tdlib.zip --repo "$repo" \
            --target "$GITHUB_SHA" --title "$DATED_TAG" --notes "$notes" || \
            gh release upload "$DATED_TAG" tdlib-out/tdlib.zip --repo "$repo" --clobber

          gh release delete tdlib-latest --repo "$repo" --yes --cleanup-tag 2>/dev/null || true
          gh release create tdlib-latest tdlib-out/tdlib.zip --repo "$repo" \
            --target "$GITHUB_SHA" --title "TDLib (latest build)" --notes "$notes"
