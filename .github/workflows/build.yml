name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache TDLib
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: |
            tdlib/libs
            tdlib/src/main/jniLibs
            tdlib/src/main/java/org
          # Bump the suffix to force a re-download of the upstream archive.
          key: tdlib-${{ runner.os }}-v2

      - name: Fetch TDLib
        id: fetch-tdlib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: ./scripts/fetch-tdlib.sh

      - name: Report TDLib availability
        id: tdlib
        run: |
          if [ -f tdlib/libs/tdlib.aar ] || [ -f tdlib/src/main/java/org/drinkless/tdlib/TdApi.java ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "TDLib is installed; the real flavour will be built."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TDLib could not be fetched — only the mock flavour will be built."
          fi

      - name: Write credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          {
            echo "TELEGRAM_API_ID=${TELEGRAM_API_ID}"
            echo "TELEGRAM_API_HASH=${TELEGRAM_API_HASH}"
          } > local.properties

      - name: Unit tests
        run: ./gradlew --no-daemon :telegram:test :app:testMockDebugUnitTest

      - name: Assemble mock flavour
        run: ./gradlew --no-daemon assembleMockDebug

      - name: Assemble real flavour
        if: steps.tdlib.outputs.available == 'true'
        run: ./gradlew --no-daemon assembleRealDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tvgram-apks
          if-no-files-found: error
          path: app/build/outputs/apk/**/*.apk

      - name: Publish APKs to a release
        # Only when the real flavour exists. app-latest replaces whatever was
        # there before, so publishing a mock-only build would quietly downgrade
        # a working release to sample data — and "latest" has to mean the real
        # app. Mock-only builds are still available as the artifact above.
        if: >-
          github.ref_name == github.event.repository.default_branch &&
          steps.tdlib.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release
          for apk in $(find app/build/outputs/apk -name '*.apk'); do
            flavour=$(basename "$apk" .apk)
            cp "$apk" "release/tvgram-${flavour#app-}.apk"
          done
          ls -la release

          notes="Built from ${GITHUB_SHA:0:7} by .github/workflows/build.yml.

          * \`tvgram-real-debug.apk\` — connects to your Telegram account. This is the one you want.
          * \`tvgram-mock-debug.apk\` — generated sample content, no account needed.

          Install with \`adb install -r <file>\`, or sideload it onto the TV."

          gh release delete app-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create app-latest release/*.apk \
            --title "TVGram (latest build)" --notes "$notes"
