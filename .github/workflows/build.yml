name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache TDLib
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: |
            tdlib/libs
            tdlib/src/main/jniLibs
            tdlib/src/main/java/org
          # Bump the suffix to force a re-download of the upstream archive.
          key: tdlib-${{ runner.os }}-v1

      - name: Fetch TDLib
        id: fetch-tdlib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: ./scripts/fetch-tdlib.sh

      - name: Report TDLib availability
        id: tdlib
        run: |
          if [ -f tdlib/libs/tdlib.aar ] || [ -f tdlib/src/main/java/org/drinkless/tdlib/TdApi.java ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "TDLib is installed; the real flavour will be built."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TDLib could not be fetched — only the mock flavour will be built."
          fi

      - name: Write credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          {
            echo "TELEGRAM_API_ID=${TELEGRAM_API_ID}"
            echo "TELEGRAM_API_HASH=${TELEGRAM_API_HASH}"
          } > local.properties

      - name: Unit tests
        run: ./gradlew --no-daemon :telegram:test :app:testMockDebugUnitTest

      - name: Assemble mock flavour
        run: ./gradlew --no-daemon assembleMockDebug

      - name: Assemble real flavour
        if: steps.tdlib.outputs.available == 'true'
        run: ./gradlew --no-daemon assembleRealDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tvgram-apks
          if-no-files-found: error
          path: app/build/outputs/apk/**/*.apk
